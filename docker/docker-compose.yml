name: daftra-orders-api

services:
    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        container_name: daftra-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ../:/var/www
        networks:
            - daftra

    nginx:
        image: nginx:alpine
        container_name: daftra-nginx
        restart: unless-stopped
        ports:
            - "9000:80"
        volumes:
            - ../:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - daftra

    mysql:
        image: mysql:8.0
        container_name: daftra-mysql
        restart: unless-stopped
        ports:
            - "3308:3306"
        environment:
            MYSQL_DATABASE: daftra_orders_api
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_USER: daftra_orders_api_user
            MYSQL_PASSWORD: daftra_orders_api_password
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - daftra

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: daftra-phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        depends_on:
            - mysql
        networks:
            - daftra

networks:
    daftra:
        driver: bridge

volumes:
    mysql_data:
        driver: local
